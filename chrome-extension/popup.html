<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告报表同步助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      background: transparent;
      border-radius: 14px;
    }
    body {
      width: 320px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      border-radius: 14px;
      border: 1px solid #2f3a5e;
      overflow: hidden;
    }
    .header {
      margin-bottom: 16px;
    }
    .header-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 4px;
    }
    .header-title {
      text-align: center;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #3d3d54;
      border-radius: 8px;
      background: #2d2d44;
      color: #aaa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: #3d3d54;
      color: #fff;
    }
    .header h1 {
      font-size: 20px;
      color: #1877f2;
      margin-bottom: 0;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1877f2;
      color: white;
    }
    .btn-primary.state-collecting {
      background: #166fe5;
    }
    .btn-primary.state-success {
      background: #1f9d65;
    }
    .btn-primary.state-error {
      background: #d64545;
    }
    .btn-primary:hover {
      background: #166fe5;
    }
    .btn-primary:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .btn-primary.state-success:disabled {
      background: #1f9d65;
    }
    .btn-primary.state-error:disabled {
      background: #d64545;
    }
    .btn-secondary {
      background: #2d2d44;
      color: #aaa;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #3d3d54;
    }
    .stats {
      margin-top: 16px;
      padding: 12px;
      background: #2d2d44;
      border-radius: 8px;
      font-size: 12px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .stats-label {
      color: #888;
    }
    .stats-value {
      color: #fff;
    }
    .log {
      margin-top: 14px;
      padding: 10px;
      background: #0d0d1a;
      border-radius: 8px;
      font-size: 11px;
      max-height: 120px;
    }
    .log-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }
    .log-clear-btn {
      border: 1px solid #3d3d54;
      background: #1f1f30;
      color: #aaa;
      font-size: 11px;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .log-clear-btn:hover {
      color: #fff;
      background: #2a2a40;
    }
    .log-list {
      max-height: 110px;
      overflow-y: auto;
    }
    .log-entry {
      padding: 4px 0;
      color: #888;
    }
    .log-entry.info {
      color: #4caf50;
    }
    .log-entry.success {
      color: #4caf50;
    }
    .log-entry.error {
      color: #f44336;
    }
    .input-group {
      margin-bottom: 14px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .field-label-row label {
      margin-bottom: 0;
    }
    .field-label-row .icon-btn {
      width: 32px;
      height: 32px;
      font-size: 16px;
      border-radius: 8px;
    }
    #refreshOptionsBtn {
      border-color: #ff5b5b;
      background: #c62828;
      color: #fff;
      font-weight: 700;
    }
    #refreshOptionsBtn:hover {
      border-color: #ff8787;
      background: #e53935;
      color: #fff;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #6d7fb3;
      border-radius: 6px;
      background: #c7d5f6;
      color: #16203a;
      font-size: 13px;
    }
    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: #1877f2;
    }
    .input-group select {
      border-radius: 10px;
    }
    .action-row {
      display: flex;
      gap: 8px;
    }
    .action-row .btn-primary {
      flex: 1;
    }
    .status-note {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      text-align: center;
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    .status-note.success {
      color: #4caf50;
    }
    .status-note.error {
      color: #f44336;
    }
    .usage-note {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #304067;
      background: #1b2440;
      color: #9fb3e8;
      font-size: 11px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <h1>📊 广告报表同步助手</h1>
    </div>
  </div>

  <div class="input-group">
    <div class="field-label-row">
      <label>项目名称</label>
      <button class="icon-btn" id="refreshOptionsBtn" title="刷新下拉选项">↻</button>
    </div>
    <select id="projectName"></select>
  </div>

  <div class="input-group">
    <label>投手名称</label>
    <select id="buyerName"></select>
  </div>

  <div class="input-group">
    <label>上传模式</label>
    <select id="uploadMode">
      <option value="消耗">消耗</option>
      <option value="回流">回流</option>
    </select>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="collectBtn">开始采集数据</button>
  </div>
  <div class="usage-note">仅在你点击“开始采集数据”后，读取当前 Ads Manager 页面报表数据并上传到你配置的业务表。</div>
  <div class="status-note" id="statusNote"></div>

  <div class="log" id="log" style="display: none;">
    <div class="log-toolbar">
      <button class="log-clear-btn" id="clearHistoryBtn">一键清空</button>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
