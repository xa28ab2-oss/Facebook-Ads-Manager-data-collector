<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告报表同步助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #3d3d54;
      border-radius: 8px;
      background: #2d2d44;
      color: #aaa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: #3d3d54;
      color: #fff;
    }
    .header h1 {
      font-size: 20px;
      color: #1877f2;
      margin-bottom: 0;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1877f2;
      color: white;
    }
    .btn-primary.state-collecting {
      background: #166fe5;
    }
    .btn-primary.state-success {
      background: #1f9d65;
    }
    .btn-primary.state-error {
      background: #d64545;
    }
    .btn-primary:hover {
      background: #166fe5;
    }
    .btn-primary:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #2d2d44;
      color: #aaa;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #3d3d54;
    }
    .stats {
      margin-top: 16px;
      padding: 12px;
      background: #2d2d44;
      border-radius: 8px;
      font-size: 12px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .stats-label {
      color: #888;
    }
    .stats-value {
      color: #fff;
    }
    .log {
      margin-top: 12px;
      padding: 8px;
      background: #0d0d1a;
      border-radius: 8px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
    }
    .log-entry {
      padding: 2px 0;
      color: #888;
    }
    .log-entry.info {
      color: #4caf50;
    }
    .log-entry.error {
      color: #f44336;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2d2d44;
      color: #fff;
      font-size: 13px;
    }
    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: #1877f2;
    }
    .action-row {
      display: flex;
      gap: 8px;
    }
    .action-row .btn-primary {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="icon-btn" id="refreshOptionsBtn" title="刷新下拉选项">↻</button>
    <button class="icon-btn" id="toggleLogBtn" title="显示日志">📝</button>
  </div>

  <div class="header">
    <h1>📊 广告报表同步助手</h1>
  </div>

  <div class="input-group">
    <label>项目名称</label>
    <select id="projectName"></select>
  </div>

  <div class="input-group">
    <label>投手名称</label>
    <select id="buyerName"></select>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="collectBtn">开始采集数据</button>
  </div>

  <div class="log" id="log" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
