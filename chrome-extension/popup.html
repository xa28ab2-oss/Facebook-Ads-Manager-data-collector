<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Ads 数据采集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      color: #1877f2;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 11px;
      color: #888;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      text-align: center;
    }
    .status.idle {
      background: #2d2d44;
      color: #aaa;
    }
    .status.collecting {
      background: #1a4d1a;
      color: #4caf50;
    }
    .status.success {
      background: #1a4d4d;
      color: #4dd0e1;
    }
    .status.error {
      background: #4d1a1a;
      color: #f44336;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1877f2;
      color: white;
    }
    .btn-primary:hover {
      background: #166fe5;
    }
    .btn-primary:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #2d2d44;
      color: #aaa;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #3d3d54;
    }
    .stats {
      margin-top: 16px;
      padding: 12px;
      background: #2d2d44;
      border-radius: 8px;
      font-size: 12px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .stats-label {
      color: #888;
    }
    .stats-value {
      color: #fff;
    }
    .log {
      margin-top: 12px;
      padding: 8px;
      background: #0d0d1a;
      border-radius: 8px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
    }
    .log-entry {
      padding: 2px 0;
      color: #888;
    }
    .log-entry.info {
      color: #4caf50;
    }
    .log-entry.error {
      color: #f44336;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2d2d44;
      color: #fff;
      font-size: 13px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #1877f2;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Facebook Ads 数据采集</h1>
    <p>采集广告数据并上传到 Lark 多维表格</p>
  </div>

  <div class="status idle" id="status">等待采集...</div>

  <div class="input-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="用于写入多维表格" value="">
  </div>

  <div class="input-group">
    <label>项目名称</label>
    <input type="text" id="projectName" placeholder="用于写入多维表格" value="">
  </div>

  <div class="input-group">
    <label>投手名称</label>
    <input type="text" id="buyerName" placeholder="用于写入多维表格" value="">
  </div>

  <button class="btn btn-primary" id="collectBtn">开始采集数据</button>
  <button class="btn btn-secondary" id="clearBtn">清空日志</button>

  <div class="stats" id="stats" style="display: none;">
    <div class="stats-row">
      <span class="stats-label">采集记录数</span>
      <span class="stats-value" id="recordCount">0</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">总花费</span>
      <span class="stats-value" id="totalSpend">$0</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">总展示</span>
      <span class="stats-value" id="totalImpressions">0</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">总点击</span>
      <span class="stats-value" id="totalClicks">0</span>
    </div>
  </div>

  <div class="log" id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
